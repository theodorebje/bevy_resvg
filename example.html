<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>bevy_resvg example</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
    canvas { display: block; }
  </style>
</head>
<body>
  <script type="module">
    const params = new URLSearchParams(window.location.search);
    const name = params.get("n") || "simple";

    try {
      const { default: init } = await import(`./wasm/${name}.js`);
      init();
    } catch (err) {
      document.body.innerHTML = `
        <div style="color:#e74c3c;padding:2rem;font-family:system-ui;">
          <h2>Failed to load example "${name}"</h2>
          <p>${err}</p>
          <a href="./" style="color:#a8d8ea;">← back</a>
        </div>`;
    }
  </script>
</body>
</html>
