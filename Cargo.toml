[package]
authors = ["Theodore Bjernhed <fosseder@danwin1210.de>"]
categories = ["game-development", "graphics", "multimedia::images", "rendering"]
description = "A simple library for rendering SVGs in Bevy using the amazing Resvg library."
edition = "2024"
exclude = ["cliff.toml", "release.toml"]
keywords = ["bevy", "gamedev", "graphics", "render", "svg"]
license = "MIT OR Apache-2.0"
name = "bevy_resvg"
readme = "README.md"
repository = "https://github.com/theodorebje/bevy_resvg"
rust-version = "1.95"
version = "2.6.0-beta"

[dependencies]
bevy = { version = "0.20", default-features = false, features = [
    "bevy_log",
    "bevy_sprite_render",
    "bevy_ui",
    "std",
] }
pastey = "0.2.1"
resvg = ">=0.42, ^0.48"
serde = { version = "1.0", features = ["derive"] }
thiserror = ">=1.0, <3.0"

[dev-dependencies]
bevy = { version = "0.20", default-features = true, features = ["debug"] }
bevy_pancam = { git = "https://github.com/cesartalen/bevy_pancam.git", branch = "bevy-0.20" } # TODO: Change when merged

[profile.release]
lto = "thin"
strip = true

[lints.clippy]
needless_pass_by_value = { priority = 1, level = "allow" } # Bevy freaks out over references
nursery = "deny"
pedantic = "deny"
type_complexity = { priority = 1, level = "allow" }        # Bevy queries are inherently complex
